project:
  type: website
  output-dir: docs
  post-render:
    - python scripts/make_nojekyll.py

  resources:
    - og-card.png

website:
  title: "환경 데이터 노트"
  site-url: https://jesfcne.github.io
  favicon: favicon.svg
  # 링크를 공유했을 때 제목·설명·미리보기 이미지가 뜨게 한다.
  open-graph: true
  twitter-card: true
  image: og-card.png
  back-to-top-navigation: true
  description: "국내 공개 환경 데이터를 직접 수집·분석해 얻은 인사이트 기록"
  navbar:
    left:
      - href: notes/index.qmd
        text: 노트
      - href: claims.qmd
        text: 인사이트
      - href: sources.qmd
        text: 데이터 출처
      - href: status.qmd
        text: 수집 현황
      - href: about.qmd
        text: 소개
    right:
      - icon: github
        href: https://github.com/jesfcne/jesfcne.github.io
        aria-label: GitHub 저장소
  page-footer:
    left: "출처 표기 조건 아래 자유롭게 인용할 수 있습니다."
    right: "[RSS](/notes/index.xml) · [GitHub](https://github.com/jesfcne/jesfcne.github.io)"

lang: ko

format:
  html:
    theme:
      light: [themes/typography.scss, themes/structure.scss, themes/light.scss]
      dark: [themes/typography.scss, themes/structure.scss, themes/dark.scss]
    include-in-header:
      # Pretendard. 시스템 기본 한글 글꼴(맑은 고딕)과 조판 품질 차이가 크다.
      - text: |
          <link rel="preconnect" href="https://cdn.jsdelivr.net">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    toc: true
    toc-title: 목차
    code-fold: true
    code-summary: "코드 보기"
    code-tools: false

# 둘 다 status 가 있는 문서(=노트)에만 적용된다.
filters:
  # 프론트매터의 status 를 본문 맨 위 배지로 보여준다.
  - filters/status-badge.lua
  # 노트 끝에 정정 제보 안내를 붙인다.
  - filters/note-footer.lua

execute:
  freeze: auto
  warning: false
