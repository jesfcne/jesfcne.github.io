project:
  type: website
  output-dir: docs
  post-render:
    - python scripts/make_nojekyll.py

website:
  title: "환경 데이터 노트"
  site-url: https://jesfcne.github.io
  description: "국내 공개 환경 데이터를 직접 수집·분석해 얻은 인사이트 기록"
  navbar:
    left:
      - href: notes/index.qmd
        text: 노트
      - href: claims.qmd
        text: 인사이트
      - href: sources.qmd
        text: 데이터 출처
      - href: status.qmd
        text: 수집 현황
      - href: about.qmd
        text: 소개
    right:
      - icon: github
        href: https://github.com/jesfcne/jesfcne.github.io
        aria-label: GitHub 저장소
  page-footer:
    left: "출처 표기 조건 아래 자유롭게 인용할 수 있습니다."
    right: "[GitHub](https://github.com/jesfcne/jesfcne.github.io)"

lang: ko

format:
  html:
    theme:
      light: [themes/typography.scss, themes/structure.scss, themes/light.scss]
      dark: [themes/typography.scss, themes/structure.scss, themes/dark.scss]
    include-in-header:
      # Pretendard. 시스템 기본 한글 글꼴(맑은 고딕)과 조판 품질 차이가 크다.
      - text: |
          <link rel="preconnect" href="https://cdn.jsdelivr.net">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    toc: true
    toc-title: 목차
    code-fold: true
    code-summary: "코드 보기"
    code-tools: false

execute:
  freeze: auto
  warning: false
