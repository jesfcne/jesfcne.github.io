project:
  type: website
  # 렌더링 산출물은 커밋하지 않는다. GitHub Actions 가 렌더링해 Pages 에 배포한다.
  output-dir: _site
  # 사이트에 올릴 페이지만 고른다. METHODOLOGY.md, README.md 같은 내부 문서는
  # 루트에 있어도 렌더링되지 않는다. _ 로 시작하는 폴더(issues/_template/)는
  # Quarto 가 알아서 뺀다.
  render:
    - "*.qmd"
    - "issues/**/*.qmd"

  resources:
    - og-card.png

website:
  title: "기후·환경 주간 브리핑"
  site-url: https://jesfcne.github.io
  favicon: favicon.svg
  # 링크를 공유했을 때 제목·설명·미리보기 이미지가 뜨게 한다.
  open-graph: true
  twitter-card: true
  image: og-card.png
  back-to-top-navigation: true
  description: "한 주의 기후·환경 이슈를 긴 흐름 속에서 정리하는 주간 뉴스레터"
  navbar:
    left:
      - href: issues/index.qmd
        text: 지난 호
      - href: about.qmd
        text: 소개
    right:
      - icon: rss
        href: issues/index.xml
        aria-label: RSS
      - icon: github
        href: https://github.com/jesfcne/jesfcne.github.io
        aria-label: GitHub 저장소
  page-footer:
    left: "출처 표기 조건 아래 자유롭게 인용할 수 있습니다."
    right: "[RSS](/issues/index.xml) · [GitHub](https://github.com/jesfcne/jesfcne.github.io)"

lang: ko

format:
  html:
    theme:
      light: [themes/typography.scss, themes/structure.scss, themes/newsletter.scss, themes/light.scss]
      dark: [themes/typography.scss, themes/structure.scss, themes/newsletter.scss, themes/dark.scss]
    include-in-header:
      # Pretendard. 시스템 기본 한글 글꼴(맑은 고딕)과 조판 품질 차이가 크다.
      - text: |
          <link rel="preconnect" href="https://cdn.jsdelivr.net">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    # 처음 방문한 독자에게는 기기의 라이트/다크 설정을 따른다. 토글로 바꾸면 그 선택을 기억한다.
    respect-user-color-scheme: true
    toc: true
    toc-title: 목차
    code-fold: true
    code-summary: "코드 보기"
    code-tools: false

# 둘 다 프론트매터에 issue 가 있는 문서(=각 호)에만 적용된다.
filters:
  # 제목 위 부제(호수·기간)를 issue, period 로 만든다.
  - filters/issue-header.lua
  # 각 호 끝에 정정 제보 안내를 붙인다.
  - filters/issue-footer.lua

execute:
  # 차트 코드는 작성자 컴퓨터에서 실행하고 결과를 _freeze/ 에 커밋한다.
  # CI 는 코드를 다시 실행하지 않고 저장된 결과로 렌더링한다.
  freeze: auto
  warning: false
