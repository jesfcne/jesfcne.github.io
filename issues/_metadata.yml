# issues/ 아래 모든 호에 적용되는 설정.
# 목록 페이지인 issues/index.qmd 는 프론트매터에서 comments: false 로 끈다.

# 댓글은 이 저장소의 GitHub Discussions 에 저장된다. 제3자 서비스에 글이 남지 않고,
# 광고와 추적기가 붙지 않으며, 저장소를 옮기면 댓글도 함께 따라온다.
# 읽는 사람은 GitHub 계정이 필요하다.
comments:
  giscus:
    repo: jesfcne/jesfcne.github.io
    repo-id: R_kgDOIYqsKw
    # Announcements 유형이라 아무나 새 토론을 열 수 없다. 댓글은 giscus 가
    # 호마다 자동으로 만든 토론에만 달린다.
    category: Announcements
    category-id: DIC_kwDOIYqsK84DEPOi
    # 호의 주소로 토론을 짝짓는다. 제목을 고쳐도 댓글이 흩어지지 않는다.
    # 다만 폴더명(issues/2026-W43 등)을 바꾸면 기존 댓글과 연결이 끊긴다.
    mapping: pathname
    reactions-enabled: true
    # 글이 길어서 입력창을 위에 둔다. 끝까지 스크롤하지 않아도 쓸 수 있다.
    input-position: top
    # 첫 화면 로딩에 댓글 iframe 이 끼어들지 않게 한다.
    loading: lazy
    language: ko
    # 사이트의 라이트/다크 토글을 따라간다.
    theme:
      light: light
      dark: dark_dimmed

# 차트 코드는 독자에게 보이지 않는다. 코드는 저장소에서 볼 수 있다.
execute:
  echo: false

# 출처 표기. 각 호 폴더의 references.json(CSL JSON)에 출처를 모으고,
# 본문에서는 [@g-03] 처럼 id 로 인용한다. 같은 출처를 여러 번 인용해도
# 번호 하나로 묶이고, 호 끝에 출처 목록이 자동으로 만들어진다.
# 목록 위치는 각 호 끝의 ::: {#refs} 로 정한다(정정 안내보다 앞에 두기 위해).
# 번호식 위첨자(Nature 양식)를 쓴다. 뉴스레터 문장을 덜 끊기 때문이다.
csl: ../editorial/nature.csl
link-citations: true
link-bibliography: true
