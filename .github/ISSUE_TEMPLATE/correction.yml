name: 정정 제보
description: 발행된 호의 사실·수치·출처 오류를 알려 주세요
title: "[정정] "
labels: [correction]
body:
  - type: input
    id: issue
    attributes:
      label: 호와 이슈
      description: 예) 2026-W43 「예시 국제기구 연례 보고서」
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 틀린 내용
      description: 본문의 어느 문장이 어떻게 틀렸는지
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 근거
      description: 바른 내용을 확인할 수 있는 출처(링크, 문서 이름)
    validations:
      required: true
